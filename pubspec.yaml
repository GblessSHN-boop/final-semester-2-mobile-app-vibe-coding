name: kalkulator_ipk_ips
description: "Kalkulator IPK & IPS - Aplikasi penghitung IPK dan IPS untuk mahasiswa"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.3
  cloud_firestore: ^5.6.7
  image_picker: ^1.1.2
  provider: ^6.1.5
  intl: ^0.20.2
  fl_chart: ^0.70.2
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "asset/icons/app_icon.png"
  web:
    generate: true
    image_path: "asset/icons/app_icon.png"
    background_color: "#2E3292"
    theme_color: "#2E3292"

flutter:
  uses-material-design: true

  assets:
    - asset/icons/
    - asset/branding/